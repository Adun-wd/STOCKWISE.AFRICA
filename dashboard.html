            <tbody id="low" class="divide-y divide-slate-100"></tbody></table></div>

        <section class="rounded-lg border border-slate-200 bg-white p-4" aria-labelledby="qa">
          <h2 id="qa" class="font-heading text-sm font-bold text-[#17396b]">Quick actions</h2>

      <div id="banner" class="mt-3 hidden items-center justify-between gap-3 rounded-lg bg-slate-100 px-4 py-3"></div>
    </main>

    <p id="sync" class="mt-3 flex items-center justify-center gap-2 rounded-md bg-slate-100 px-3 py-2.5 text-xs font-semibold text-slate-800" role="status"></p>
  </div>

<script>
// Shared notifications for every page. Each page includes a copy of this code before its own script.
// Add a notification from any page:  Notify.add({ type: 'update', kind: 'sale', title: '...', message: '...', href: 'page.html' })
//   type: 'alert' | 'update' | 'system'     kind (picks the icon): 'low-stock' | 'expiry' | 'sync' | 'sale' | 'stock' | 'team'
const Notify = (() => {
  const KEY = 'notifications', LOW_STOCK_LEVEL = 10; // change LOW_STOCK_LEVEL once the real rule is agreed
  let mem = null; // used only if the browser blocks storage
  const raw = () => { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v !== null) return v; } catch (e) {} return mem; };
  const save = (list) => { mem = list; try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} };
  const ago = (h) => new Date(Date.now() - h * 3600e3).toISOString();
  const all = () => {
    if (raw() === null) save([ // sample notifications from the design, until the backend provides real ones
      { id: 's1', type: 'alert', kind: 'low-stock', title: 'Low stock alert', message: 'Paracetamol 500mg is running low (2 left).', href: 'stock-in.html', read: false, createdAt: ago(2) },
      { id: 's2', type: 'alert', kind: 'expiry', title: 'Product expiring soon', message: 'Multivitamin syrup will expire in 5 days.', href: 'product-details.html', read: false, createdAt: ago(4) },
      { id: 's3', type: 'alert', kind: 'sync', title: 'Sync issue', message: 'Failed to sync with server - retrying...', href: 'settings.html', read: false, createdAt: ago(6) },
      { id: 's4', type: 'update', kind: 'sale', title: 'New sale recorded', message: '₦1,800 - 2 items', href: 'sales.html', read: false, createdAt: ago(8) },
      { id: 's5', type: 'system', kind: 'team', title: 'Team member invited', message: 'Sarah Connor has been invited to join your team.', href: 'team.html', read: true, createdAt: ago(24) },
    ]);
    return raw() || [];
  };
  const unread = () => all().filter((n) => !n.read).length;
  const badge = () => {
    const b = document.getElementById('bell-badge'), bell = document.getElementById('bell'), c = unread();
    if (!b) return;
    b.textContent = c > 9 ? '9+' : c; b.classList.toggle('hidden', c === 0);
    if (bell) bell.setAttribute('aria-label', c ? `Notifications, ${c} unread` : 'Notifications');
  };
  const add = (n) => {
    const id = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2);
    save([{ id, read: false, createdAt: new Date().toISOString(), ...n }, ...all()]); badge();
  };
  // Losing the connection while changes are waiting is worth telling the user about
  window.addEventListener('offline', () => {
    let q = []; try { q = JSON.parse(localStorage.getItem('stockQueue')) || []; } catch (e) {}
    if (q.some((m) => !m.synced) && !all().some((n) => n.kind === 'sync' && !n.read))
      add({ type: 'alert', kind: 'sync', title: 'Sync issue', message: 'You are offline. Changes will sync when you reconnect.', href: 'settings.html' });
  });
  window.addEventListener('storage', badge);
  document.addEventListener('DOMContentLoaded', badge);
  return { all, save, add, unread, badge, LOW_STOCK_LEVEL };
})();
</script>
<script>
  const $ = (id) => document.getElementById(id);
  const ic = (d) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const I = {
    home: '<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/>', inv: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    cart: '<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l3 12h11l2-8H6"/>', bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    chart: '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
    out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
  };
  const item = (href, label, icon, o = {}) => `<a href="${href}" ${o.current ? 'aria-current="page"' : ''} ${o.id ? `id="${o.id}"` : ''} class="flex shrink-0 items-center gap-3 rounded-lg px-3 py-2.5 text-sm ${o.current ? 'bg-white font-medium text-[#17396b]' : (o.red ? 'text-red-300 hover:bg-white/10' : 'text-white hover:bg-white/10')}">${ic(I[icon])}${label}</a>`;
  $('nav').innerHTML = item('dashboard.html', 'Home', 'home', { current: true }) + item('inventory.html', 'Inventory', 'inv') + item('sales.html', 'Sales', 'cart') + item('alerts.html', 'Alerts', 'bell') + item('reports.html', 'Reports', 'chart');
  $('nav-bottom').innerHTML = item('a href./settings.html', 'Settings', 'gear') + item('login.html', 'Logout', 'out', { red: true, id: 'logout' });
  $('logout').addEventListener('click', () => { try { sessionStorage.clear(); } catch (e) {} });
  try { const u = JSON.parse(sessionStorage.getItem('user')) || {}; if (u.role) $('user-role').textContent = u.role; } catch (e) {}

  /* ---------- Dates: real calendar, any year, in the business's own time zone ---------- */
  const TZ_BY_COUNTRY = { Nigeria: 'Africa/Lagos', Ghana: 'Africa/Accra', Kenya: 'Africa/Nairobi', 'South Africa': 'Africa/Johannesburg', Egypt: 'Africa/Cairo',
    Ethiopia: 'Africa/Addis_Ababa', Tanzania: 'Africa/Dar_es_Salaam', Uganda: 'Africa/Kampala', Rwanda: 'Africa/Kigali', Morocco: 'Africa/Casablanca',
    Senegal: 'Africa/Dakar', "Côte d'Ivoire": 'Africa/Abidjan', 'Ivory Coast': 'Africa/Abidjan', Cameroon: 'Africa/Douala', Zambia: 'Africa/Lusaka',
    Zimbabwe: 'Africa/Harare', Algeria: 'Africa/Algiers', Tunisia: 'Africa/Tunis', Angola: 'Africa/Luanda', Namibia: 'Africa/Windhoek', Botswana: 'Africa/Gaborone' };
  let country = 'Nigeria'; try { country = (JSON.parse(sessionStorage.getItem('business')) || {}).country || 'Nigeria'; } catch (e) {}
  const TZ = TZ_BY_COUNTRY[country] || 'Africa/Lagos';
  const MAX_DAYS = 366;                                                   // longest range allowed (agree the real limit with the backend)
  const isoOf = (date) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
  const utc = (iso) => new Date(iso + 'T00:00:00Z');
  const addDays = (iso, n) => new Date(utc(iso).getTime() + n * 864e5).toISOString().slice(0, 10);
  const diff = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
  const fmtDay = (iso, o = { month: 'short', day: 'numeric', year: 'numeric' }) => utc(iso).toLocaleDateString('en-US', { ...o, timeZone: 'UTC' });
  const fmtTime = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return `${String(h % 12 || 12).padStart(2, '0')}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
  const today = () => isoOf(new Date());                                  // switches to 2027 by itself on 1 January 2027
  const naira = (n) => '₦' + Math.round(n).toLocaleString('en-NG');
  const short = (n) => n >= 1e6 ? '₦' + +(n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? '₦' + +(n / 1e3).toFixed(1) + 'k' : '₦' + n;

  /* ---------- Data. api.sales() stands in for the backend: it returns finished numbers, the page only displays them ---------- */
  const PRODUCTS = [['Paracetamol 500mg', 1200], ['Amoxicillin 250mg', 2500], ['Cough Syrup 200ml', 1800], ['Vitamin C 1000mg', 3000], ['Multivitamin Syrup', 1800], ['Ibuprofen 400mg', 1500]];
  const STAFF = ['Alex Morgan', 'Sarah Connor', 'Mary Smith', 'Jane Doe'], PAY = ['Cash', 'Card', 'Bank Transfer', 'Other'];
  const rand = (s) => { let t = (s + 0x6D2B79F5) | 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const sampleDay = (iso) => { const n = diff('2020-01-01', iso), out = [], count = 1 + Math.floor(rand(n) * 4);
    for (let k = 0; k < count; k++) { const r = (i) => rand(n * 53 + k * 7 + i), p = PRODUCTS[Math.floor(r(1) * PRODUCTS.length)], q = 1 + Math.floor(r(2) * 3), x = r(3);
      out.push({ id: `${iso}-${k}`, day: iso, time: `${String(8 + Math.floor(r(4) * 12)).padStart(2, '0')}:${String(Math.floor(r(5) * 60)).padStart(2, '0')}`, product: p[0], qty: q, price: p[1], total: q * p[1],
        pay: x < .42 ? PAY[0] : x < .74 ? PAY[1] : x < .92 ? PAY[2] : PAY[3], by: STAFF[Math.floor(r(6) * STAFF.length)] }); }
    return out; };
  const recorded = () => { let q = []; try { q = JSON.parse(localStorage.getItem('stockQueue')) || []; } catch (e) {}   // sales made on the Record Sale page
    return q.filter((m) => m.type === 'sale').map((m) => { const d = new Date(m.createdAt), parts = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(d);
      return { id: m.id, day: isoOf(d), time: parts, product: 'Paracetamol 500mg', qty: m.quantity, price: m.unitPrice, total: m.total, pay: m.paymentMethod === 'POS / Card' ? 'Card' : (PAY.includes(m.paymentMethod) ? m.paymentMethod : 'Other'), by: 'John Doe' }; }); };
  const nowHM = () => new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date());
  const salesIn = (from, to) => { const out = [], t0 = today(), hm = nowHM(); for (let d = from; d <= to; d = addDays(d, 1)) out.push(...sampleDay(d).filter((x) => x.day !== t0 || x.time <= hm)); return [...out, ...recorded().filter((s) => s.day >= from && s.day <= to)].sort((a, b) => (b.day + b.time).localeCompare(a.day + a.time)); };
  const sum = (rows) => ({ total: rows.reduce((a, s) => a + s.total, 0), count: rows.length });
  const api = { sales(from, to) {
    const len = diff(from, to) + 1, rows = salesIn(from, to), cur = sum(rows), prev = sum(salesIn(addDays(from, -len), addDays(from, -1)));
    const step = len <= 31 ? 'day' : len <= 120 ? 'week' : 'month', buckets = new Map();
    const key = (iso) => step === 'day' ? iso : step === 'week' ? addDays(from, Math.floor(diff(from, iso) / 7) * 7) : iso.slice(0, 7);
    for (let d = from; d <= to; d = addDays(d, 1)) buckets.set(key(d), 0);
    rows.forEach((s) => buckets.set(key(s.day), buckets.get(key(s.day)) + s.total));
    const by = PAY.map((p) => ({ name: p, value: rows.filter((s) => s.pay === p).reduce((a, s) => a + s.total, 0) }));
    return { len, rows, summary: { ...cur, avg: cur.count ? cur.total / cur.count : 0, refunds: 0 }, previous: { ...prev, avg: prev.count ? prev.total / prev.count : 0 }, step,
      series: [...buckets].map(([k, v]) => ({ key: k, value: v })), by }; } };

  const smooth = (pts) => pts.map((p, i) => { if (!i) return `M${p[0]},${p[1]}`; const q = pts[i - 1], mx = (q[0] + p[0]) / 2; return `C${mx},${q[1]} ${mx},${p[1]} ${p[0]},${p[1]}`; }).join(' ');
  const niceMax = (v) => { if (v <= 0) return 1000; const e = 10 ** Math.floor(Math.log10(v)), n = v / e; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 4 ? 4 : n <= 5 ? 5 : 10) * e; };

  const chart = (data) => { const W = 560, H = 190, L = 46, B = 24, T = 8, R = 12, pts = data.series, max = niceMax(Math.max(...pts.map((p) => p.value)));
    if (!pts.some((p) => p.value)) return '<p class="py-16 text-center text-xs text-slate-500">No sales in this date range.</p>';
    const x = (i) => L + (pts.length < 2 ? (W - L - R) / 2 : i * (W - L - R) / (pts.length - 1)), y = (v) => T + (H - T - B) * (1 - v / max), xy = pts.map((p, i) => [x(i), y(p.value)]);
    const every = Math.ceil(pts.length / 8), lab = (k) => data.step === 'month' ? fmtDay(k + '-01', { month: 'short', year: '2-digit' }) : fmtDay(k, { month: 'short', day: 'numeric' });
    const grid = [0, .25, .5, .75, 1].map((f) => `<line x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#e5e7eb"/><text x="${L - 6}" y="${y(max * f) + 3}" text-anchor="end" font-size="8" fill="#667085">${f ? short(max * f) : '₦0'}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" class="w-full" role="img" aria-label="Sales from ${fmtDay(range.from)} to ${fmtDay(range.to)}, total ${naira(data.summary.total)}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2358b8" stop-opacity=".25"/><stop offset="1" stop-color="#2358b8" stop-opacity="0"/></linearGradient></defs>${grid}
      <path d="${smooth(xy)} L${xy[xy.length - 1][0]},${H - B} L${xy[0][0]},${H - B} Z" fill="url(#g)"/><path d="${smooth(xy)}" fill="none" stroke="#17396b" stroke-width="1.5"/>
      ${pts.length <= 31 ? xy.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="#17396b"/>`).join('') : ''}
      ${pts.map((p, i) => i % every === 0 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="8" fill="#667085">${lab(p.key)}</text>` : '').join('')}</svg>`; };

  const COLORS = ['#17396b', '#f6a54a', '#7c7cf0', '#ef5350'];
  const percents = (vals) => { const t = vals.reduce((a, v) => a + v, 0), raw = vals.map((v) => v / t * 100), out = raw.map(Math.floor); let left = 100 - out.reduce((a, v) => a + v, 0);
    raw.map((r, i) => [r - out[i], i]).sort((x, y) => y[0] - x[0]).forEach(([, i]) => { if (left > 0) { out[i]++; left--; } }); return out; };   // whole numbers that add up to 100
  const donut = (data) => { const total = data.by.reduce((a, p) => a + p.value, 0), C = 2 * Math.PI * 60; let off = 0;
    const pct = percents(data.by.map((p) => p.value));
    if (!total) return '<p class="py-16 text-center text-xs text-slate-500">No sales in this date range.</p>';
    const rings = data.by.map((p, i) => { const len = p.value / total * C, el = `<circle r="60" cx="80" cy="80" fill="none" stroke="${COLORS[i]}" stroke-width="24" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`; off += len; return el; }).join('');
    return `<svg viewBox="0 0 160 160" class="h-44 w-44" role="img" aria-label="Sales by payment method">${rings}<text x="80" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#17396b" font-family="Space Grotesk, sans-serif">${naira(total)}</text><text x="80" y="94" text-anchor="middle" font-size="7" fill="#667085">Total Sales</text></svg>
      <ul class="space-y-3 text-[11px]">${data.by.map((p, i) => `<li class="flex items-center gap-3"><span class="h-2.5 w-2.5 rounded-full" style="background:${COLORS[i]}"></span><span class="w-24">${p.name}</span><b class="font-medium">${pct[i]}%</b></li>`).join('')}</ul>`; };


  /* ---------- The store today: every number here comes from the same data as the Sales, Reports and Alerts pages ---------- */
  let range = { from: addDays(today(), -6), to: today() }, day = today();          // chart range, and the day the cards show
  const PILL = {};                                                                  // (payment colours are not used on this page)
  const lowItems = [['a0', 'Amoxicillin 250mg', 'SKU001', 6, 20], ['a3', 'Ibuprofen 400mg', 'SKU004', 9, 10], ['a6', 'Multivitamin Syrup', 'SKU007', 3, 15], ['a7', 'Metformin 500mg', 'SKU008', 8, 15],
    ['a8', 'Vitamin C 1000mg', 'SKU009', 5, 10], ['a9', 'Cough Syrup 200ml', 'SKU010', 4, 10], ['a10', 'Zinc Tablets', 'SKU011', 7, 10]];        // id, name, SKU, units left, reorder level
  const OUT = ['a1', 'a11', 'a12'], EXP = ['a2', 'a5', 'a13', 'a14'];               // out-of-stock and expiring alerts on the Alerts page
  const TOTAL_PRODUCTS = 248, STOCK_VALUE = 532400;                                  // sample until the backend provides them
  const gone = () => { try { return JSON.parse(localStorage.getItem('alertsDismissed')) || []; } catch (e) { return []; } };
  const live = (ids) => ids.filter((id) => !gone().includes(id));
  const sub = (iso, n) => addDays(iso, -n);
  const chip = (cur, prev, tail, dark) => { const base = dark ? 'text-white/80' : 'text-slate-600';
    if (!prev) return `<span class="rounded px-1.5 py-0.5 text-[9px] ${dark ? 'bg-white/15' : 'bg-slate-100'} ${base}">no previous data</span>`;
    const p = Math.round((cur - prev) / prev * 100);
    return (p === 0 ? `<span class="rounded px-1.5 py-0.5 text-[9px] ${dark ? 'bg-white/15' : 'bg-slate-100'} ${base}">— no change</span>`
      : `<span class="rounded px-1.5 py-0.5 text-[9px] font-semibold ${p > 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-600'}">${p > 0 ? '↑' : '↓'} ${Math.abs(p)}%</span>`) + ` <span class="text-[9px] ${base}">${tail}</span>`; };

  function render() {
    const t = today(), isToday = day === t, hour = Number(new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', hourCycle: 'h23' }).format(new Date()));
    $('greet').textContent = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    $('sub').textContent = isToday ? "Here's what's happening with your store today." : `Here's what happened with your store on ${fmtDay(day)}.`;
    $('day-label').textContent = (isToday ? 'Today, ' : '') + fmtDay(day, { month: 'short', day: '2-digit', year: 'numeric' });
    const cur = salesIn(day, day), prev = salesIn(sub(day, 1), sub(day, 1)), tc = cur.reduce((a, s) => a + s.total, 0), tp = prev.reduce((a, s) => a + s.total, 0);
    const uc = cur.reduce((a, s) => a + s.qty, 0), up = prev.reduce((a, s) => a + s.qty, 0), low = live(lowItems.map((x) => x[0])).length;
    const tail = isToday ? 'vs. yesterday' : 'vs. day before';
    const card = (title, value, extra, icon, dark) => `<li class="rounded-lg border p-4 ${dark ? 'border-[#17396b] bg-[#17396b] text-white' : 'border-slate-200 bg-white'}"><p class="flex items-center gap-2 text-xs font-semibold"><span class="flex h-6 w-6 items-center justify-center rounded-full ${dark ? 'bg-white text-[#17396b]' : 'bg-slate-100 text-[#17396b]'}" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg></span>${title}</p><p class="font-heading mt-3 text-3xl font-bold ${dark ? '' : 'text-[#17396b]'}">${value}</p><p class="mt-1">${extra}</p></li>`;
    $('stats').innerHTML = card('Total Sales', naira(tc), chip(tc, tp, tail, true), I.cart, true) + card('Products Sold', uc, chip(uc, up, tail), '<path d="m21 8-9-5-9 5v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>') +
      card('Current Stock Value', naira(STOCK_VALUE), chip(1.08, 1, 'vs. last week'), '<circle cx="12" cy="12" r="9"/><path d="M9 9h6M9 12h6M12 9v7"/>') +
      card('Low Stock Items', low, `<a href="alerts.html?tab=low" class="text-[9px] text-[#17396b] underline">${low ? 'need restocking' : 'all stocked up'}</a>`, '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>');

    data = api.sales(range.from, range.to); $('chart-range').value = range.to === t && ['7', '30', '90'].includes(String(data.len)) ? String(data.len) : '7';
    $('chart').innerHTML = chart(data);

    const out = live(OUT).length, exp = live(EXP).length, inStock = TOTAL_PRODUCTS - low - out - exp, parts = [['In Stock', inStock, '#17396b'], ['Low Stock', low, '#f6a54a'], ['Out of Stock', out, '#ef5350'], ['Expiring Soon', exp, '#7c7cf0']], C = 2 * Math.PI * 60; let off = 0;
    $('status').innerHTML = `<svg viewBox="0 0 160 160" class="h-44 w-44" role="img" aria-label="${TOTAL_PRODUCTS} products: ${parts.map((p) => p[1] + ' ' + p[0]).join(', ')}">${parts.map(([, v, c]) => { const len = v / TOTAL_PRODUCTS * C, el = `<circle r="60" cx="80" cy="80" fill="none" stroke="${c}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`; off += len; return el; }).join('')}
      <text x="80" y="82" text-anchor="middle" font-size="26" font-weight="700" fill="#17396b" font-family="Space Grotesk, sans-serif">${TOTAL_PRODUCTS}</text><text x="80" y="96" text-anchor="middle" font-size="8" fill="#17396b">Total Products</text></svg>
      <ul class="w-44 space-y-2.5 text-[11px]">${parts.map(([n, v, c]) => `<li class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full" style="background:${c}"></span><span class="flex-1">${n}</span><b class="${n === 'In Stock' ? '' : 'font-medium'}">${v}</b></li>`).join('')}</ul>`;

    const recent = salesIn(addDays(t, -30), t).slice(0, 5);
    $('recent').innerHTML = recent.map((r) => `<tr><td class="px-2 py-2.5 font-medium">${fmtDay(r.day, { month: 'short', day: 'numeric' })}, ${fmtTime(r.time)}</td><td class="px-2 py-2.5 font-medium">${r.product}</td><td class="px-2 py-2.5 text-center">${r.qty}</td><td class="px-2 py-2.5">${naira(r.total)}</td></tr>`).join('') || '<tr><td colspan="4" class="px-2 py-6 text-center text-slate-500">No sales yet.</td></tr>';
    const lows = lowItems.filter((x) => live([x[0]]).length).sort((a, b) => a[3] - b[3]).slice(0, 5);
    $('low').innerHTML = lows.map((x) => `<tr><td class="px-2 py-2.5 font-medium">${x[1]}</td><td class="px-2 py-2.5 text-center">${x[3]}</td><td class="px-2 py-2.5 text-center">${x[4]}</td></tr>`).join('') || '<tr><td colspan="3" class="px-2 py-6 text-center text-slate-500">Nothing is running low.</td></tr>';
    const worst = lows[0]; $('banner').classList.toggle('hidden', !worst); $('banner').classList.toggle('flex', !!worst);
    if (worst) $('banner').innerHTML = `<p class="flex items-center gap-3 text-[11px]"><span aria-hidden="true">💡</span><span><b class="block text-xs">Stock alert</b>${worst[1]} is running low. Only ${worst[3]} unit${worst[3] === 1 ? '' : 's'} left (reorder level ${worst[4]}).</span></p>
      <a href="product-details.html?sku=${worst[2]}" class="shrink-0 rounded-md border border-[#17396b] bg-white px-4 py-2 text-[11px] font-semibold text-[#17396b] hover:bg-slate-50">View product →</a>`;
    syncBar();
  }
  const syncBar = () => { let q = []; try { q = JSON.parse(localStorage.getItem('stockQueue')) || []; } catch (e) {} const n = q.filter((m) => !m.synced).length, on = navigator.onLine;
    $('sync').innerHTML = `<span class="h-2.5 w-2.5 rounded-full ${on ? (n ? 'bg-amber-500' : 'bg-emerald-500') : 'bg-slate-500'}" aria-hidden="true"></span>` + (!on ? `Offline${n ? ' • ' + n + ' change' + (n === 1 ? '' : 's') + ' saved on this device' : ''}` : n ? `${n} change${n === 1 ? '' : 's'} waiting to sync` : 'All changes synced'); };
  window.addEventListener('online', syncBar); window.addEventListener('offline', syncBar);

  const qa = (href, label, icon) => `<li><a href="${href}" class="flex items-center gap-2 rounded-md border border-slate-300 bg-white px-3 py-2.5 text-[11px] font-semibold hover:bg-slate-50">${ic(I[icon])}<span class="flex-1">${label}</span><span aria-hidden="true">›</span></a></li>`;
  Object.assign(I, { plus: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>', minus: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>', eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>', box: '<path d="m21 8-9-5-9 5v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>' });
  $('quick').innerHTML = qa('add-product.html', 'Add Product', 'box') + qa('record-sale.html', 'Record Sale', 'cart') + qa('stock-in.html', 'Add Stock', 'plus') + qa('stock-out.html', 'Remove Stock', 'minus') + qa('inventory.html', 'View Stock Inventory', 'eye');

  /* ---------- Controls ---------- */
  const panel = $('day-panel'), openDay = (on) => { panel.classList.toggle('hidden', !on); $('day-btn').setAttribute('aria-expanded', on); if (on) { $('day').max = today(); $('day').value = day; $('day').focus(); } };
  $('day-btn').addEventListener('click', () => openDay(panel.classList.contains('hidden')));
  $('day').addEventListener('change', (e) => { const v = e.target.value; if (v && v <= today()) { day = v; render(); } });
  $('day-today').addEventListener('click', () => { day = today(); $('day').value = day; render(); });
  $('day-close').addEventListener('click', () => { openDay(false); $('day-btn').focus(); });
  document.addEventListener('click', (e) => { if (!panel.classList.contains('hidden') && !e.target.closest('#day-panel, #day-btn')) openDay(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.classList.contains('hidden')) { openDay(false); $('day-btn').focus(); } });
  $('chart-range').addEventListener('change', (e) => { const n = Number(e.target.value); if (n) { range = { from: addDays(today(), -(n - 1)), to: today() }; render(); } });
  let data = null; render();
</script>
