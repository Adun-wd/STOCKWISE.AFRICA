<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Choose your role | Stockwise Africa</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  body { font-family: 'Inter', system-ui, sans-serif; color: #101828; }
  .font-heading { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  /* The logo image is white, so this turns it dark blue on the white header */
  .logo-navy { filter: brightness(0) saturate(100%) invert(17%) sepia(54%) saturate(1500%) hue-rotate(188deg) brightness(92%) contrast(95%); }
</style>
</head>
<body class="bg-slate-50">

<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-12 gap-y-3 px-6 py-4">
    <img src="https://res.cloudinary.com/gzmezpec/image/upload/v1791398404/stw.png" alt="Stockwise Africa" class="logo-navy h-10 w-auto" />
    <nav aria-label="Setup progress" class="min-w-[280px] max-w-md flex-1 text-[11px]">
      <div class="flex justify-between"><b>Step 2 of 3</b><span class="text-slate-600">Your access</span></div>
      <ol class="mt-1 flex items-center gap-2 font-semibold">
        <li class="flex items-center gap-1.5"><span class="flex h-5 w-5 items-center justify-center rounded-full bg-[#17396b] text-[10px] text-white">1</span>Business</li>
        <li class="h-px flex-1 bg-[#17396b]" aria-hidden="true"></li>
        <li class="flex items-center gap-1.5" aria-current="step"><span class="flex h-5 w-5 items-center justify-center rounded-full bg-[#17396b] text-[10px] text-white">2</span>Role Selection</li>
        <li class="h-px flex-1 bg-[#17396b]" aria-hidden="true"></li>
        <li class="flex items-center gap-1.5 font-normal text-slate-600"><span class="flex h-5 w-5 items-center justify-center rounded-full border border-[#17396b] text-[10px]">3</span>Finish</li>
      </ol>
    </nav>
  </div>
</header>

<main class="mx-auto max-w-5xl px-4 pb-12 pt-8 text-center">
  <p class="text-sm">Personalize your workspace</p>
  <h1 class="font-heading mt-1 text-4xl font-bold text-[#17396b]">Choose your role</h1>
  <p class="mt-2 text-xs text-slate-600">Select the role that best describes how you will use Stockwise Africa.</p>

  <form id="roles" novalidate class="mt-8 text-left">
    <fieldset>
      <legend class="sr-only">Role</legend>
      <div id="cards" class="grid gap-4 md:grid-cols-3"></div>
    </fieldset>
    <p id="role-error" class="mt-3 hidden text-center text-xs text-red-600" role="alert"></p>

    <div class="mt-6 flex items-center justify-between">
      <a href="../authentication/business-setup.html" class="flex min-h-11 items-center rounded-lg border border-[#17396b] bg-white px-8 text-sm font-semibold text-[#17396b] hover:bg-slate-50">Back</a>
      <a href="../dashboard/dashboard.html" class=" flex min-h-11 rounded-lg bg-[#17396b] px-10 text-sm font-semibold text-white shadow-md shadow-[#17396b]/30 hover:opacity-90 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#17396b] focus-visible:ring-offset-2">Finish</a>
    </div>
  </form>
</main>

<script>
  const icon = (paths) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
  const roles = [
    { title: 'Owner', description: 'Full control of your business, inventory, sales, suppliers, reports and team.',
      icon: icon('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21v-6h6v6"/><path d="M9 8h.01M15 8h.01M12 8h.01"/>'),
      can: ['Manage business settings', 'Manage products', 'Manage inventory', 'Manage sales', 'Manage suppliers', 'View reports', 'Manage team'] },
    { title: 'Manager', description: 'Manage daily business operations and keep inventory and sales running smoothly.',
      icon: icon('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'),
      can: ['Manage products', 'Manage inventory', 'Manage sales', 'Manage suppliers', 'View reports', 'Manage stock conflicts'] },
    { title: 'Sales Attendant', description: 'Handle sales and view the information needed for your daily work.',
      icon: icon('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),
      can: ['Create sales', 'View products', 'View inventory', 'View low-stock items', 'View own sales', 'Request sales voids'] },
  ];

  document.getElementById('cards').innerHTML = roles.map((r) => `
    <label class="relative flex cursor-pointer flex-col rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200 transition hover:ring-slate-300 has-[:checked]:ring-2 has-[:checked]:ring-[#17396b] has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-[#17396b]">
      <input type="radio" name="role" value="${r.title}" class="peer sr-only" />
      <span class="absolute right-4 top-4 h-4 w-4 rounded-full border border-slate-400 bg-white peer-checked:border-[#17396b] peer-checked:bg-[#17396b] peer-checked:shadow-[inset_0_0_0_3px_white]" aria-hidden="true"></span>
      <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-blue-50 text-[#17396b]">${r.icon}</span>
      <span class="mt-4 text-lg">${r.title}</span>
      <span class="mt-2 text-[11px] leading-snug text-slate-500">${r.description}</span>
      <span class="mt-4 border-t border-slate-100 pt-4 text-[10px] font-semibold tracking-wide text-slate-600">WHAT YOU CAN DO</span>
      <ul class="mt-3 space-y-2.5 text-[11px]">${r.can.map((c) => `
        <li class="flex items-center gap-2"><span class="flex h-4 w-4 items-center justify-center rounded-full bg-emerald-50 text-[9px] text-emerald-600" aria-hidden="true">✓</span>${c}</li>`).join('')}
      </ul>
    </label>`).join('');

  const form = document.getElementById('roles'), note = document.getElementById('role-error');
  form.addEventListener('change', () => { note.classList.add('hidden'); note.textContent = ''; });
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const role = form.elements.role.value;
    if (!role) { note.textContent = 'Choose a role to continue.'; note.classList.remove('hidden'); return; }
    // Mock until the backend API is connected
    try { const u = JSON.parse(sessionStorage.getItem('user')) || {}; sessionStorage.setItem('user', JSON.stringify({ ...u, role })); } catch (e) {}
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
